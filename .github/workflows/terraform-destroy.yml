# Destruye toda la infraestructura que administra Terraform (usa el tfstate guardado en S3).
# Se corre a mano: pestaña Actions -> "Terraform destroy" -> Run workflow, escribiendo "destruir".
name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe "destruir" para confirmar'
        required: true

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  # Llave pública SSH fija (GitHub -> Settings -> Secrets and variables -> Actions -> Variables).
  # Su llave privada está en el secret SSH_PRIVATE_KEY y la usa el workflow de deploy.
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  # Correo que recibe las alarmas de CloudWatch (variable ALARM_EMAIL)
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}

jobs:
  destroy:
    if: inputs.confirmar == 'destruir'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Preparar credenciales de AWS (GitHub Secrets)
        env:
          # Credenciales del Learner Lab guardadas en GitHub Secrets (se actualizan en cada sandbox nuevo)
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          # Quita espacios, saltos de línea y el prefijo "nombre=" que se cuelan al pegar los secrets
          limpiar() { printf '%s' "$1" | tr -d '[:space:]'; }
          K=$(limpiar "$KEY_ID");        K=${K#aws_access_key_id=}
          S=$(limpiar "$SECRET_KEY");    S=${S#aws_secret_access_key=}
          T=$(limpiar "$SESSION_TOKEN"); T=${T#aws_session_token=}
          if [ -z "$K" ] || [ -z "$S" ] || [ -z "$T" ]; then
            echo "::error::Falta algún secret: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY o AWS_SESSION_TOKEN"
            exit 1
          fi
          echo "::add-mask::$K"; echo "::add-mask::$S"; echo "::add-mask::$T"
          {
            echo "AWS_ACCESS_KEY_ID=$K"
            echo "AWS_SECRET_ACCESS_KEY=$S"
            echo "AWS_SESSION_TOKEN=$T"
          } >> "$GITHUB_ENV"

      - name: Verificar credenciales de AWS
        run: aws sts get-caller-identity

      - name: Buscar el bucket S3 del tfstate
        id: bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="to-do-list-api-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "::error::No existe el bucket $BUCKET: no hay tfstate, nada que destruir."
            exit 1
          fi
          echo "name=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=${{ steps.bucket.outputs.name }}"

      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve -var="ssh_cidr=0.0.0.0/0"

      - name: Resumen
        run: |
          {
            echo "## Infraestructura destruida"
            echo ""
            echo "El bucket del tfstate (\`${{ steps.bucket.outputs.name }}\`) se conserva para la próxima vez."
            echo "Ya puedes borrar el secreto **EC2_HOST**, esa IP ya no existe."
          } >> "$GITHUB_STEP_SUMMARY"
